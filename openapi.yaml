openapi: 3.0.3
info:
  title: CRUD Master Gateway API
  version: 1.0.0
  description: |
    Public API for the CRUD Master movie-streaming platform.

    The gateway forwards Inventory requests over HTTP without changing the
    Inventory response. It publishes billing requests to RabbitMQ; the Billing
    service processes those messages asynchronously.
servers:
  - url: http://localhost:8000
    description: Gateway port forwarded to the local machine
tags:
  - name: Inventory
    description: Proxied movie inventory operations
  - name: Billing
    description: Asynchronous billing message publishing
paths:
  /api/movies:
    get:
      tags: [Inventory]
      summary: List movies
      description: Returns all movies, optionally filtering titles by a case-insensitive substring.
      parameters:
        - name: title
          in: query
          description: Non-empty title substring to search for.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Movies returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
    post:
      tags: [Inventory]
      summary: Create a movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieCreate'
      responses:
        '201':
          description: Movie created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
    delete:
      tags: [Inventory]
      summary: Delete all movies
      responses:
        '200':
          description: All movies deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAllMoviesResult'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
  /api/movies/{movie_id}:
    parameters:
      - name: movie_id
        in: path
        required: true
        description: Numeric movie identifier.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Inventory]
      summary: Get a movie by ID
      responses:
        '200':
          description: Movie returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
    put:
      tags: [Inventory]
      summary: Update a movie by ID
      description: Updates either `title`, `description`, or both fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieUpdate'
      responses:
        '200':
          description: Movie updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
    delete:
      tags: [Inventory]
      summary: Delete a movie by ID
      responses:
        '200':
          description: Movie deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/MovieNotFound'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
  /api/billing:
    post:
      tags: [Billing]
      summary: Queue a billing order
      description: |
        Publishes a durable JSON message to `billing_queue`. A `200` response
        means RabbitMQ accepted the message; it does not mean the order has
        already been written to the Billing database. The request still succeeds
        while the Billing application is stopped, provided RabbitMQ is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
      responses:
        '200':
          description: Message successfully posted to RabbitMQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: RabbitMQ is unavailable to the gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Movie:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Interstellar
        description:
          type: string
          example: A team travels through a wormhole to save humanity.
    MovieCreate:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Interstellar
        description:
          type: string
          minLength: 1
          example: A team travels through a wormhole to save humanity.
    MovieUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Interstellar (2014)
        description:
          type: string
          minLength: 1
          example: Explorers travel through a wormhole to save humanity.
    BillingInput:
      type: object
      required: [user_id, number_of_items, total_amount]
      properties:
        user_id:
          type: string
          example: '20'
        number_of_items:
          type: string
          example: '2'
        total_amount:
          type: string
          example: '250'
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Message posted
    DeleteAllMoviesResult:
      type: object
      required: [message, deleted_count]
      properties:
        message:
          type: string
          example: All movies deleted
        deleted_count:
          type: integer
          minimum: 0
          example: 3
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Inventory service is currently unavailable
  responses:
    BadRequest:
      description: The request is invalid for the Inventory API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MovieNotFound:
      description: No movie exists with this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InventoryUnavailable:
      description: The gateway cannot reach the Inventory API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
